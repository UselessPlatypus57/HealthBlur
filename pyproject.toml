[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelguard"
version = "0.1.0"
description = "Privacy pipeline that finds and removes patient identifiers from DICOM metadata and burned-in pixel text, with a per-file audit trail."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydicom>=3.0",
    "numpy>=1.26",
    "pillow>=10.1",
    "easyocr>=1.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
codecs = ["pylibjpeg>=2.0", "pylibjpeg-libjpeg>=2.1", "pylibjpeg-openjpeg>=2.3"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
pixelguard = "pixelguard.cli:main"

[tool.setuptools.packages.find]
include = ["pixelguard*"]

[tool.setuptools.package-data]
pixelguard = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ocr: runs the real EasyOCR model (slow; downloads model weights on first run)"]
addopts = "-m 'not ocr'"
